name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Build app bundle
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent "Video Diary.app" VideoDiary.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDiary-macOS
          path: build/VideoDiary.zip
